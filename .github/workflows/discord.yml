name: Discord Message Notify

on:
    push:
        branches:
            - develop
    pull_request:
        branches:
            - develop

jobs:
    notify_discord_of_push:
        name: Get Commit Message
        runs-on: ubuntu-latest
        env:
            COMMIT_MESSAGE: ""
        steps:
            - name: Check out repo's head branch
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.head_ref || github.ref }} # For pull_request events, GITHUB_REF contains the merge branch (refs/pull/:prNumber/merge).

            - name: Get commit message
              run: |
                  msg=""
                  if [ "${{ github.event_name }}" = "push" ]; then
                      msg="${{ github.event.head_commit.message }}"
                  else
                      msg="${{ github.event.pull_request.title }}"
                  fi
                  echo "COMMIT_MESSAGE<<EOF" >> "$GITHUB_ENV"
                  echo "$msg" >> "$GITHUB_ENV"
                  echo "EOF" >> "$GITHUB_ENV"

            - name: Notify discord
              uses: appleboy/discord-action@v1.2.0
              with:
                  webhook_id: ${{ secrets.WEBHOOK_ID }}
                  webhook_token: ${{ secrets.WEBHOOK_TOKEN }}
                  color: "#48f442"
                  username: "GitHub Bot"
                  message: |
                      ${{ github.event_name }} by @${{ github.actor }}
                      message: ${{ env.COMMIT_MESSAGE }}
